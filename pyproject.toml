[project]
name = "playbook-rag"
version = "0.1.0"
description = "Question-answering over dxw's Playbook using retrieval-augmented generation with Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "anthropic>=0.34",
    "tqdm>=4.66",
    "pdfplumber>=0.11.10",
]

[tool.uv]
# These are standalone scripts, not an installable package.
package = false
